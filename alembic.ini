# alembic.ini — Alembic configuration
#
# Fix: this file used to be missing, so `alembic upgrade head` would fail
# anywhere (CI, CD, a new server) with "No 'script_location' key found".
# Connection comes from the DATABASE_URL env var (see migrations/env.py),
# so no credentials live here.
#
# Note: keep this file's comments ASCII-only. Alembic reads it with
# encoding="locale", which on a non-UTF-8 Windows locale (cp1252) crashes
# on non-ASCII bytes before any migration logic even runs.

[alembic]
script_location = migrations
prepend_sys_path = .

# Overridden by the DATABASE_URL env var in env.py — this is a placeholder
sqlalchemy.url =postgresql://postgres.ellzuwnhvqsqeoweqoed:Fg4taqPUkjm6AgTS@aws-0-ap-south-1.pooler.supabase.com:5432/postgres

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
