# nginx.conf — Smart Madrasa ERP
# SSL + Rate Limiting + Security Headers

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ── Rate Limiting Zones ──────────────────────────────────────
    # API: IP প্রতি ৩০ req/মিনিট
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    # Login: IP প্রতি ৫ req/মিনিট (brute-force রোধ)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # General: IP প্রতি ১০০ req/মিনিট
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

    limit_req_status 429;

    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    client_max_body_size 10m;

    # ── Upstream ─────────────────────────────────────────────────
    upstream api {
        server api:8000;
        keepalive 32;
    }
    upstream streamlit {
        server streamlit:8501;
    }

    # ── HTTP → HTTPS Redirect ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificates (Let's Encrypt বা self-signed)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL Security Settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security Headers ─────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: ws:;" always;

        # Server info লুকান
        server_tokens off;

        # ── Login endpoint — Strict Rate Limit ───────────────────
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_log_level warn;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API Routes ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;

            # CORS headers (FastAPI handles this, but backup)
            add_header Access-Control-Allow-Origin $http_origin always;
        }

        # ── Payment Callback — অতিরিক্ত সুরক্ষা ─────────────────
        location ~* /\?(page=.*payment|payment_callback) {
            limit_req zone=api_limit burst=5 nodelay;

            # শুধু bKash/Nagad IP থেকে allow (production-এ IP whitelist করুন)
            # allow 103.118.196.0/24;  # bKash IP range
            # deny all;

            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── File Upload — Size Limit ──────────────────────────────
        location /upload {
            client_max_body_size 5m;
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Streamlit UI ──────────────────────────────────────────
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # X-Forwarded-For যোগ করা হয়েছে — Streamlit-এর st.context.ip_address
            # এটা পড়ে public form (online admission, password reset) এ
            # per-IP rate-limiting করে (app.py-স্তরের সুরক্ষা, nginx zone-এর
            # পাশাপাশি, যেহেতু general_limit zone সম্পূর্ণ অ্যাপের সব রিকোয়েস্ট
            # শেয়ার করে — নির্দিষ্ট public form-এর জন্য আলাদা কড়াকড়ি না)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ── Block common attack paths ─────────────────────────────
        location ~* \.(env|git|sql|bak|log|conf)$ {
            deny all;
            return 404;
        }
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
