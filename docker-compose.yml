version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-madrasa2024}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-madrasa2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-madrasa2024}@redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-madrasa2024}@redis:6379/0
      - API_BASE_URL=http://api:8000/api/v1
      - APP_URL=${APP_URL:-https://localhost}
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BKASH_APP_KEY=${BKASH_APP_KEY}
      - BKASH_APP_SECRET=${BKASH_APP_SECRET}
      - BKASH_USERNAME=${BKASH_USERNAME}
      - BKASH_PASSWORD=${BKASH_PASSWORD}
      - NAGAD_MERCHANT_ID=${NAGAD_MERCHANT_ID}
      - NAGAD_MERCHANT_KEY=${NAGAD_MERCHANT_KEY}
      - WA_INSTANCE_ID=${WA_INSTANCE_ID}
      - WA_TOKEN=${WA_TOKEN}
      - SMS_API_KEY=${SMS_API_KEY}
    depends_on:
      - redis
      - api
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4 -Q default,sms,reports
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-madrasa2024}@redis:6379/0
      - BROKER_URL=redis://:${REDIS_PASSWORD:-madrasa2024}@redis:6379/0
      - BACKEND_URL=redis://:${REDIS_PASSWORD:-madrasa2024}@redis:6379/1
      - WA_INSTANCE_ID=${WA_INSTANCE_ID}
      - WA_TOKEN=${WA_TOKEN}
      - SMS_API_KEY=${SMS_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BROKER_URL=redis://:${REDIS_PASSWORD:-madrasa2024}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
      - streamlit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  certbot_webroot:
